name: Tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.9", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install test dependencies
        run: |
          pip install -r requirements-dev.txt
          python -m playwright install --with-deps chromium
      - name: Install LibreOffice (draws template backgrounds in the tests)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libreoffice-impress
      - name: Run the tests
        run: python tests/run_all.py
      - name: Package the skill
        run: python tools/package.py
      - name: Keep the test output when something fails
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-output-py${{ matrix.python }}
          path: tests/.out
