name: Release

# Pushing a tag such as v1.0.0 runs the tests, packages the skill and
# attaches it to a GitHub release.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 30   # a stalled package download should fail the run, not hold it for hours
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Check that the tag matches the version in the code
        run: |
          version=$(sed -n 's/^VERSION = "\(.*\)"/\1/p' dynamic-decks/scripts/_deck.py)
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "Tag $GITHUB_REF_NAME does not match VERSION $version in dynamic-decks/scripts/_deck.py"
            exit 1
          fi
      - name: Install test dependencies
        run: |
          pip install -r requirements-dev.txt
          python -m playwright install --with-deps chromium
      - name: Install LibreOffice (draws template backgrounds in the tests)
        run: |
          sudo apt-get -o Acquire::Retries=3 update
          sudo apt-get -o Acquire::Retries=3 install -y --no-install-recommends libreoffice-impress
          soffice --version   # the tests skip their drawing part when this is missing, so fail here instead
      - name: Run the tests
        run: python tests/run_all.py
      - name: Package the skill
        run: python tools/package.py
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # A release drafted on github.com already exists by the time this runs,
          # so attach the files to it. A tag pushed from git has no release yet,
          # so create one.
          if gh release view "$GITHUB_REF_NAME" > /dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" dist/dynamic-decks.skill dist/dynamic-decks.zip --clobber
          else
            gh release create "$GITHUB_REF_NAME" dist/dynamic-decks.skill dist/dynamic-decks.zip --title "DynamicDecks $GITHUB_REF_NAME" --generate-notes --verify-tag
          fi
